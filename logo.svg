<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52" role="img" aria-label="RAAS Enterprise Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
  </defs>

  <!-- Icon: gradient rounded square -->
  <rect width="52" height="52" rx="13" fill="url(#logoGrad)"/>
  <!-- Subtle inner rim for depth -->
  <rect width="52" height="52" rx="13" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- R: vertical stem -->
  <rect x="10" y="10" width="6" height="32" fill="white"/>

  <!-- R: bowl outer + counter cutout (evenodd punches the hole) -->
  <path fill-rule="evenodd" fill="white" d="
    M 16,10 H 29 Q 38,10 38,19 Q 38,28 29,28 H 16 Z
    M 16,14 H 26 Q 33,14 33,19 Q 33,24 26,24 H 16 Z
  "/>

  <!-- R: diagonal leg -->
  <polygon points="16,28 24,28 42,42 34,42" fill="white"/>

  <!-- Wordmark -->
  <text x="68" y="30"
    font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif"
    font-weight="800" font-size="22" letter-spacing="1"
    fill="#0D0D0D">RAAS</text>
  <text x="69" y="44"
    font-family="'Inter','Plus Jakarta Sans',system-ui,sans-serif"
    font-weight="500" font-size="9" letter-spacing="4.5"
    fill="#6B7280">ENTERPRISE</text>
</svg>
