<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="RAAS Enterprise Logo">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FBBF24;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background pill (optional, remove for transparent) -->
  <!-- Icon: Hexagon with stylized R and circuit accent -->
  <g transform="translate(4, 8)">
    <!-- Outer hexagon -->
    <polygon points="32,0 58,15 58,45 32,60 6,45 6,15" fill="url(#iconGrad)" filter="url(#glow)"/>
    <!-- Inner hexagon outline -->
    <polygon points="32,6 52,18 52,42 32,54 12,42 12,18" fill="none" stroke="url(#goldAccent)" stroke-width="1.5" opacity="0.6"/>
    <!-- Stylized R letterform -->
    <text x="20" y="43" font-family="Georgia, serif" font-weight="900" font-size="34" fill="white" opacity="1">R</text>
    <!-- Gold circuit dot accents -->
    <circle cx="10" cy="14" r="2" fill="#F59E0B" opacity="0.8"/>
    <circle cx="54" cy="14" r="2" fill="#F59E0B" opacity="0.8"/>
    <circle cx="58" cy="30" r="1.5" fill="#F59E0B" opacity="0.6"/>
    <circle cx="6" cy="30" r="1.5" fill="#F59E0B" opacity="0.6"/>
  </g>

  <!-- Wordmark: RAAS -->
  <text x="76" y="38" font-family="'Georgia', 'Times New Roman', serif" font-weight="900" font-size="28" letter-spacing="3" fill="white">RAAS</text>
  <!-- Gold underline accent for RAAS -->
  <rect x="76" y="42" width="82" height="2.5" rx="1.5" fill="url(#goldAccent)"/>
  <!-- Enterprise subtitle -->
  <text x="77" y="58" font-family="'Arial', 'Helvetica', sans-serif" font-weight="400" font-size="11" letter-spacing="5" fill="#94A3B8">ENTERPRISE</text>
</svg>
